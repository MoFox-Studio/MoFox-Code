[project]
name = "mofox-code"
version = "0.1.1"
description = "Neo-MoFox Coding Agent TUI - Claude Code 风格的终端编程助手"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MoFox Team"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
urls = {Repository = "https://github.com/MoFox-Studio/MoFox-Code"}

dependencies = [
    "prompt-toolkit>=3.0",
    "pyfiglet>=1.0",
    "rich>=13.0",
    "websockets>=12.0",
]

[project.scripts]
mofox-code = "mofox_code.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mofox_code"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
